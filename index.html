<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>

<body>

<div class="form-container">
  <h2>NEW CALL</h2>

  <form>
    <label>Image URL</label>
    <input required type="text" name="image" placeholder="Enter Image URL">

    <label>Full Name</label>
    <input required type="text" name="name" placeholder="Enter Full Name">

    <label>Home Town</label>
    <input required type="text" name="town" placeholder="Enter Home Town">

    <label>Purpose</label>
    <input required type="text" name="purpose" placeholder="eg., Quick appointment note">

    <label>Category</label>

    <label><input required type="radio" name="category"><span>Emergency</span></label>
    <label><input type="radio" name="category"><span>Important</span></label>
    <label><input type="radio" name="category"><span>Urgent</span></label>
    <label><input type="radio" name="category"><span>No Rush</span></label>

    <button type="submit">Create Note</button>
  </form>

  <button class="CloseForm">Close</button>
</div>


<div class="note-container">

  <!-- LEFT ICONS -->
  <div class="left-icons">
    <button id="add-note"><i class="ri-add-line"></i></button>
    <button><i class="ri-arrow-up-line"></i></button>
    <button><i class="ri-arrow-down-line"></i></button>
  </div>

  <!-- STACK -->
  <div class="notes">

    <!-- CARD 1 -->
    <div class="note-card">
      <div class="profile">
        <img src="https://plus.unsplash.com/premium_photo-1689551671541-31a345ce6ae0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NTN8fHBlcnNvbnxlbnwwfHwwfHx8MA%3D%3D">
      </div>

      <h2 class="name">Fatima Uma</h2>

      <div class="info">
        <span>Home town</span>
        <span>Singapore</span>
      </div>

      <div class="info">
        <span>Bookings</span>
        <span>3 times</span>
      </div>

      <div class="actions">
        <button class="call-btn">Call</button>
        <button class="msg-btn">Message</button>
      </div>

      <div class="tags">
        <div class="tag black"></div>
        <div class="tag purple"></div>
        <div class="tag orange"></div>
        <div class="tag green"></div>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="note-card">
      <div class="profile">
        <img src="https://plus.unsplash.com/premium_photo-1671656349322-41de944d259b?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fHBlcnNvbnxlbnwwfHwwfHx8MA%3D%3D">
      </div>

      <h2 class="name">John Doe</h2>

      <div class="info">
        <span>Home town</span>
        <span>London</span>
      </div>

      <div class="info">
        <span>Bookings</span>
        <span>5 times</span>
      </div>

      <div class="actions">
        <button class="call-btn">Call</button>
        <button class="msg-btn">Message</button>
      </div>

      <div class="tags">
        <div class="tag black"></div>
        <div class="tag purple"></div>
        <div class="tag orange"></div>
        <div class="tag green"></div>
      </div>
    </div>

    <!-- CARD 3 -->
    <div class="note-card">
      <div class="profile">
        <img src="https://plus.unsplash.com/premium_photo-1673757119677-6445b73a405e?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTAxfHxwZXJzb258ZW58MHx8MHx8fDA%3D">
      </div>

      <h2 class="name">Emma Watson</h2>

      <div class="info">
        <span>Home town</span>
        <span>Paris</span>
      </div>

      <div class="info">
        <span>Bookings</span>
        <span>2 times</span>
      </div>

      <div class="actions">
        <button class="call-btn">Call</button>
        <button class="msg-btn">Message</button>
      </div>

      <div class="tags">
        <div class="tag black"></div>
        <div class="tag purple"></div>
        <div class="tag orange"></div>
        <div class="tag green"></div>
      </div>
    </div>

    <!-- CARD 4 -->
    <div class="note-card">
      <div class="profile">
        <img src="https://plus.unsplash.com/premium_photo-1664536392779-049ba8fde933?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTA5fHxwZXJzb258ZW58MHx8MHx8fDA%3D">
      </div>

      <h2 class="name">Alex Smith</h2>

      <div class="info">
        <span>Home town</span>
        <span>Dubai</span>
      </div>

      <div class="info">
        <span>Bookings</span>
        <span>7 times</span>
      </div>

      <div class="actions">
        <button class="call-btn">Call</button>
        <button class="msg-btn">Message</button>
      </div>

      <div class="tags">
        <div class="tag black"></div>
        <div class="tag purple"></div>
        <div class="tag orange"></div>
        <div class="tag green"></div>
      </div>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>

</html>
